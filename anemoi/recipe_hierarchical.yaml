nodes:
  data:
    node_builder:
      _target_: anemoi.graphs.nodes.AnemoiDatasetNodes
      dataset: https://data.ecmwf.int/anemoi-datasets/era5-o96-1979-2023-6h-v8.zarr
  hidden_l1:
    node_builder:
      _target_: anemoi.graphs.nodes.TriNodes
      resolution: 5
  hidden_l2:
    node_builder:
      _target_: anemoi.graphs.nodes.TriNodes
      resolution: 5
  hidden_l3:
    node_builder:
      _target_: anemoi.graphs.nodes.TriNodes
      resolution: 5

edges:
  # A) Encoder connections
  - source_name: data
    target_name: hidden_l1
    edge_builders:
    - _target_: anemoi.graphs.edges.CutOffEdges
      cutoff_factor: 0.7
  # B) Decoder connections
  - source_name: hidden_l1
    target_name: data
    target_mask_attr_name: cutout
    edge_builders:
    - _target_: anemoi.graphs.edges.KNNEdges
      num_nearest_neighbours: 3
 # C) Processor connections
  - source_name: hidden_l1
    target_name: hidden_l2
    edge_builders:
    - _target_: anemoi.graphs.edges.KNNEdges
      num_nearest_neighbours: 3
  - source_name: hidden_l2
    target_name: hidden_l3
    edge_builders:
    - _target_: anemoi.graphs.edges.KNNEdges
      num_nearest_neighbours: 3
  - source_name: hidden_l3
    target_name: hidden_l3
    edge_builders:
    - _target_: anemoi.graphs.edges.MultiScaleEdges
      x_hops: 1
  - source_name: hidden_l3
    target_name: hidden_l2
    edge_builders:
    - _target_: anemoi.graphs.edges.KNNEdges
      num_nearest_neighbours: 3
  - source_name: hidden_l2
    target_name: hidden_l1
    edge_builders:
    - _target_: anemoi.graphs.edges.KNNEdges
      num_nearest_neighbours: 3